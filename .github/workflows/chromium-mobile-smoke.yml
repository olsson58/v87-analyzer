name: Chromium mobile smoke test
on:
  push:
    branches: [test/chatgpt-write-access-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test local mobile UI
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({viewport:{width:393,height:852},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror', e=>errors.push(e.message));
            await page.route('**/*', route=>new URL(route.request().url()).hostname==='127.0.0.1'?route.continue():route.abort());
            await page.goto('http://127.0.0.1:8765/index.html');
            await page.locator('#controls').waitFor({state:'visible'});
            assert.equal(await page.locator('#budget').count(),1);
            assert.equal(await page.locator('#budget').inputValue(),'300');
            for (const amount of [100,300,850,950,1050,1500]) {
              await page.locator('#budget').fill(String(amount));
              assert.equal(await page.evaluate(()=>enforceBudget()),amount);
            }
            for (const invalid of ['', '0', '-10']) {
              await page.locator('#budget').fill(invalid);
              assert.equal(await page.evaluate(()=>enforceBudget()),300);
            }
            assert.equal(await page.evaluate(()=>historyBonus({history:[]})),0);
            assert.ok(Number.isFinite(await page.evaluate(()=>score({}))));
            // Synthetic fields only; no external racing data.
            for (const type of ['V75','V85']) {
              for (const amount of [100,300,950,1050]) {
                const result=await page.evaluate(({type,amount})=>{
                  configureGame(type,true);
                  races=Array.from({length:N},(_,i)=>({horses:Array.from({length:10},(_,j)=>({num:j+1,name:'Synthetic '+i+'-'+j,history:[],selected:false,form:10-j}))}));
                  document.getElementById('budget').value=String(amount);
                  const unit=GAME_CONFIG[type].unit;
                  const plan=suggestBalancedCounts(Math.floor((amount+1e-9)/unit));
                  return {counts:plan.counts,rows:plan.rows,cost:plan.rows*unit};
                },{type,amount});
                assert.equal(result.counts.length,type==='V75'?7:8);
                assert.ok(result.counts.every(n=>n>=1&&n<=10));
                assert.equal(result.rows,result.counts.reduce((a,b)=>a*b,1));
                assert.ok(result.cost<=amount+1e-8);
              }
            }


            // Generate real XLSX fixtures locally, with no external racing data.
            const {execFileSync}=await import('node:child_process');
            execFileSync('python3',['-c',[
              'import zipfile',
              'for n in (7,8,12):',
              ' with zipfile.ZipFile(f"/tmp/trav-{n}.xlsx","w",zipfile.ZIP_DEFLATED) as z:',
              '  rows=[\'<row r="1"><c r="A1" t="inlineStr"><is><t>Avd</t></is></c><c r="B1" t="inlineStr"><is><t>Nr</t></is></c><c r="C1" t="inlineStr"><is><t>Häst</t></is></c></row>\']',
              '  for i in range(1,n+1):',
              '   j=i+1',
              '   rows.append(f\'<row r="{j}"><c r="A{j}"><v>{i}</v></c><c r="B{j}"><v>1</v></c><c r="C{j}" t="inlineStr"><is><t>Synthetic {i}</t></is></c></row>\')',
              '  z.writestr("xl/worksheets/sheet1.xml",\'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>\'+"".join(rows)+"</sheetData></worksheet>")'
            ].join('\n')]);
            for(const n of [7,8]){
              await page.locator('#xlsxfile').setInputFiles('/tmp/trav-'+n+'.xlsx');
              await page.waitForFunction(()=>document.getElementById('importstatus').textContent.startsWith('Excel importerad'));
              assert.equal(await page.evaluate(()=>races.length),n);
              assert.equal(await page.evaluate(()=>races[0].horses[0].name),'Synthetic 1');
            }
            await page.locator('#xlsxfile').setInputFiles('/tmp/trav-12.xlsx');
            await page.waitForFunction(()=>document.getElementById('importstatus').textContent.startsWith('Excel-import:'));
            assert.equal(await page.evaluate(()=>races.length),8,'Invalid import must preserve previous round');
            assert.equal(await page.locator('#systemPanel').count(),1);
            assert.ok(await page.locator('button[onclick="startAutoFetch()"]').first().isVisible());
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true,'Mobile horizontal overflow');
            assert.deepEqual(errors,[]);
            await page.screenshot({path:'mobile-smoke.png',fullPage:true});
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-smoke
          path: mobile-smoke.png
          if-no-files-found: ignore
